# MiniCPM service: N API replicas behind one nginx address, all using one Ollama that holds the model.
# Default: the Ollama already running on the host (SERVICE_OLLAMA_URL, http://host.docker.internal:11434). To run an Ollama
# inside this stack instead, set COMPOSE_PROFILES=bundled-ollama and SERVICE_OLLAMA_URL=http://cnv_minicpm52b_model_ollama:11434 in .env.
# Start:  docker compose up -d --build          (callers use http://<host>:29200)
# Scale:  SERVICE_REPLICAS=3 docker compose up -d --build, then: docker compose restart cnv_minicpm52b_model_lb
# Ollama queues and parallelises requests itself (OLLAMA_NUM_PARALLEL), so one copy of the model serves every replica.

name: cnv_minicpm52b_model

services:
  cnv_minicpm52b_model_ollama:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-0}  # 0 = no cap
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}  # how long an idle model keeps its RAM
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - cnv_minicpm52b_model_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    networks: [cnv_minicpm52b_model]

  # One-shot: downloads the model into the ollama volume, then exits.
  cnv_minicpm52b_model_pull:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://cnv_minicpm52b_model_ollama:11434
    entrypoint: ["ollama", "pull", "${SERVICE_OLLAMA_MODEL:-${SERVICE_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}}"]
    depends_on:
      cnv_minicpm52b_model_ollama:
        condition: service_healthy
    networks: [cnv_minicpm52b_model]

  cnv_minicpm52b_model:
    build: .
    image: cnv_minicpm52b_model:latest
    restart: unless-stopped
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_OLLAMA_MODEL: ${SERVICE_OLLAMA_MODEL:-${SERVICE_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}}
      SERVICE_OLLAMA_URL: ${SERVICE_OLLAMA_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-4}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}  # same value Ollama runs with; shown read-only on /admin/
    volumes:
      - cnv_minicpm52b_model_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    depends_on:
      cnv_minicpm52b_model_pull:
        condition: service_completed_successfully
        required: false  # only exists with the bundled-ollama profile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29200/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    networks: [cnv_minicpm52b_model]

  cnv_minicpm52b_model_lb:
    container_name: cnv_minicpm52b_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29200}:29200"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cnv_minicpm52b_model:
        condition: service_healthy
    networks:
      cnv_minicpm52b_model:
      citadel:
        aliases: [cnv_minicpm52b_model_lb]

volumes:
  cnv_minicpm52b_model_ollama:
    name: cnv_minicpm52b_model_ollama
  cnv_minicpm52b_model_data:
    name: cnv_minicpm52b_model_data
networks:
  # Other stacks reach http://cnv_minicpm52b_model_lb:29200 by joining this network.
  cnv_minicpm52b_model:
    name: cnv_minicpm52b_model
  citadel:
    name: citadel_core
    external: true
