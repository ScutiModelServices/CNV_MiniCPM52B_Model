# MiniCPM service: N API replicas behind one nginx address, all using one Ollama that holds the model.
# Default: the Ollama already running on the host (OLLAMA_URL, http://host.docker.internal:11434). To run an Ollama
# inside this stack instead, set COMPOSE_PROFILES=bundled-ollama and OLLAMA_URL=http://ollama:11434 in .env.
# Start:  docker compose up -d --build          (callers use http://<host>:9130)
# Scale:  MINICPM_REPLICAS=3 docker compose up -d --build, then: docker compose restart minicpm_lb
# Ollama queues and parallelises requests itself (OLLAMA_NUM_PARALLEL), so one copy of the model serves every replica.

name: minicpm

services:
  ollama:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM_LIMIT:-0}  # 0 = no cap
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}  # how long an idle model keeps its RAM
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    networks: [minicpm]

  # One-shot: downloads the model into the ollama volume, then exits.
  minicpm_pull:
    profiles: [bundled-ollama]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${MINICPM_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [minicpm]

  minicpm:
    build: .
    restart: unless-stopped
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      MINICPM_ADMIN_PASSWORD: ${MINICPM_ADMIN_PASSWORD:-}
      MINICPM_MODEL: ${MINICPM_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MINICPM_NUM_THREAD: ${MINICPM_NUM_THREAD:-4}
      MINICPM_REPLICAS: ${MINICPM_REPLICAS:-1}  # shown read-only on /admin/
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}  # same value Ollama runs with; shown read-only on /admin/
    volumes:
      - tokens:/data
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    deploy:
      replicas: ${MINICPM_REPLICAS:-1}
    depends_on:
      minicpm_pull:
        condition: service_completed_successfully
        required: false  # only exists with the bundled-ollama profile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9130/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    networks: [minicpm]

  minicpm_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${MINICPM_PORT:-9130}:9130"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minicpm:
        condition: service_healthy
    networks: [minicpm]

volumes:
  ollama:
  tokens:

networks:
  # Other stacks reach http://minicpm_lb:9130 by joining this network.
  minicpm:
