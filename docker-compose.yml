# MiniCPM service: N API replicas behind one nginx address, all using one Ollama that holds the model.
# All replicas call the Ollama already running on the host (SERVICE_OLLAMA_URL, default http://host.docker.internal:11434).
# It must listen on 0.0.0.0 and have the model pulled. This stack does not run an Ollama.
# Start:  docker compose up -d --build          (callers use http://<host>:29200)
# Scale:  SERVICE_REPLICAS=3 docker compose up -d --build, then: docker compose restart cnv_minicpm52b_model_lb
# Ollama queues and parallelises requests itself (OLLAMA_NUM_PARALLEL on your Ollama), so one copy of the model serves every replica.

name: cnv_minicpm52b_model

services:
  cnv_minicpm52b_model:
    build: .
    image: cnv_minicpm52b_model:latest
    restart: unless-stopped
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_OLLAMA_MODEL: ${SERVICE_OLLAMA_MODEL:-${SERVICE_MODEL:-hf.co/openbmb/MiniCPM5-2B-GGUF:Q4_K_M}}
      SERVICE_OLLAMA_URL: ${SERVICE_OLLAMA_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-4}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
      SERVICE_OLLAMA_PARALLEL: ${SERVICE_OLLAMA_PARALLEL:-2}  # same value Ollama runs with; shown read-only on /admin/
    volumes:
      - cnv_minicpm52b_model_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]  # reaches an Ollama running on the host
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29200/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [cnv_minicpm52b_model]

  cnv_minicpm52b_model_lb:
    container_name: cnv_minicpm52b_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29200}:29200"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cnv_minicpm52b_model:
        condition: service_healthy
    networks:
      cnv_minicpm52b_model:
      citadel:
        aliases: [cnv_minicpm52b_model_lb]

volumes:
  cnv_minicpm52b_model_data:
    name: cnv_minicpm52b_model_data
networks:
  # Other stacks reach http://cnv_minicpm52b_model_lb:29200 by joining this network.
  cnv_minicpm52b_model:
    name: cnv_minicpm52b_model
  citadel:
    name: citadel_core
    external: true
